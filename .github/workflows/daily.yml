
name: RepoMind AI Daily Discovery

on:
  schedule:
    # 11:00 AM IST
    - cron: '30 5 * * *'

    # 5:00 PM IST
    - cron: '30 11 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover and analyze repositories
        run: python repomind.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit report if changed
        run: |
          git config user.name "Abhishek K"
          git config user.email "abhi23kk@gmail.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily RepoMind AI report"
            git push
          else
            echo "No new report changes to commit."
          fi
